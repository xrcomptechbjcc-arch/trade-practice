<style>
/* Layout: sticky top bar; full-bleed dark "network rack" hero on the splash; one 1080px content column; list-first pages built for quick scanning */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f4f7fa; --ink:#0d1726; --muted:#55657c; --line:#d5dde8;
  --accent:#0a7387; --accent-ink:#ffffff; --accent-soft:#dcf0f4;
  --good:#17804a; --good-soft:#e0f3e7; --bad:#b8363b; --bad-soft:#f9e3e3; --warn:#9a6200; --warn-soft:#fbefd8;
  --hero-bg:#0a1322; --hero-ink:#e8eef8; --hero-muted:#9fb1c9; --hero-line:#3cc4d8; --led:#36d47c; --led-amber:#f2b53a;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a111d; --surface:#111b2b; --surface-2:#15213a; --ink:#e4ebf5; --muted:#94a3b9; --line:#25344b;
  --accent:#3cc4d8; --accent-ink:#04141a; --accent-soft:#0f2f3a;
  --good:#3ccf7f; --good-soft:#0f2e20; --bad:#ff7070; --bad-soft:#3a1618; --warn:#f0b44a; --warn-soft:#352612;
  --hero-bg:#060c17; --hero-ink:#e8eef8; --hero-muted:#9fb1c9; --hero-line:#3cc4d8; --led:#36d47c; --led-amber:#f2b53a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a111d; --surface:#111b2b; --surface-2:#15213a; --ink:#e4ebf5; --muted:#94a3b9; --line:#25344b;
  --accent:#3cc4d8; --accent-ink:#04141a; --accent-soft:#0f2f3a;
  --good:#3ccf7f; --good-soft:#0f2e20; --bad:#ff7070; --bad-soft:#3a1618; --warn:#f0b44a; --warn-soft:#352612;
  --hero-bg:#060c17; --hero-ink:#e8eef8; --hero-muted:#9fb1c9; --hero-line:#3cc4d8; --led:#36d47c; --led-amber:#f2b53a;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;margin-right:auto}
.brand svg{flex:none}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-family:var(--display);font-weight:600;font-size:15px;text-decoration:none;color:var(--muted);padding:7px 11px;border-radius:8px}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
body.exam-mode .nav{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;border-radius:9px;padding:11px 18px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.1}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{font-size:14px;padding:8px 12px}

/* hero */
.hero{position:relative;background:var(--hero-bg);color:var(--hero-ink);overflow:hidden;border-bottom:3px solid var(--hero-line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .wrap{position:relative;padding-block:clamp(56px,10vw,112px) clamp(48px,8vw,88px)}
.hero .status{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:13px;color:var(--hero-muted)}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led);margin-right:7px;vertical-align:1px}
.led.amber{background:var(--led-amber);box-shadow:0 0 8px var(--led-amber);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hero h1{margin-top:22px;font-size:clamp(44px,9vw,104px);font-weight:700;letter-spacing:-.01em;line-height:.95;text-transform:uppercase}
.hero h1 span{display:block;color:var(--hero-line)}
.hero .sub{margin-top:18px;font-size:clamp(17px,2.2vw,21px);color:var(--hero-muted);max-width:40ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .btn-ghost{color:var(--hero-ink);border-color:#41536e}
.hero .btn-ghost:hover{background:rgba(255,255,255,.06)}
.hero .btn-primary{background:var(--hero-line);color:#04141a}

/* page sections */
.page{padding-block:32px 56px}
.pagehead{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.pagehead h1{font-size:clamp(30px,4.6vw,44px);font-weight:700}
.pagehead p{color:var(--muted);max-width:68ch}
.crumbs{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}
.section-title{font-size:22px;font-weight:600;margin:36px 0 14px}

.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:8px}
.tile{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:20px}
.tile p{color:var(--muted);font-size:15px}
.tile .go{margin-top:auto;font-family:var(--display);font-weight:600;color:var(--accent)}

/* unit list */
.units{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.unit-row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:18px 20px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.unit-row:first-child{border-top:0}
.unit-row:hover{background:var(--surface-2)}
.unit-num{font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent)}
.unit-row h3{font-size:19px}
.unit-meta{font-size:14px;color:var(--muted);margin-top:2px}
.weight{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;width:90px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.exam-card{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:20px 22px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent);margin-bottom:28px}
.exam-card .txt{flex:1 1 280px;min-width:0}
.exam-card h2{font-size:21px}
.exam-card p{color:var(--muted);font-size:15px;margin-top:4px}
.specs{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:13px;margin-top:8px;color:var(--ink)}

/* objectives */
.obj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.obj-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;padding:14px 18px;text-decoration:none;color:var(--ink);background:var(--surface-2);border-bottom:1px solid var(--line)}
.obj-head:hover{background:var(--accent-soft)}
.code{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--accent);white-space:nowrap}
.obj-head .t{font-weight:700;min-width:0}
.obj-head .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.subs{list-style:none;margin:0;padding:0}
.subs a{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:baseline;padding:10px 18px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.subs li:first-child a{border-top:0}
.subs a:hover{background:var(--surface-2)}
.subs .t{min-width:0}
.pill{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.ready{color:var(--good);border-color:var(--good);background:var(--good-soft)}

/* sub-unit modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.mode{display:flex;flex-direction:column;gap:10px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.mode h2{font-size:21px}
.mode p{color:var(--muted);font-size:15px}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.mode .btn{align-self:flex-start;margin-top:auto}
.notice{padding:14px 16px;border-radius:9px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);font-size:15px}
.notice.ok{background:var(--good-soft);border-color:var(--good)}
.notice.err{background:var(--bad-soft);border-color:var(--bad)}

/* form */
.form{max-width:520px;display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.field .err{color:var(--bad);font-size:14px;min-height:1.2em}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* quiz */
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.qbar .title{font-family:var(--display);font-weight:600;font-size:18px;margin-right:auto;min-width:0}
.qbar .count{font-family:var(--mono);font-size:14px;color:var(--muted)}
.timer{font-family:var(--mono);font-weight:600;font-size:18px;padding:6px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}
@media (max-width:820px){.quiz-layout{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,28px)}
.qnum{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.qtext{font-size:clamp(18px,2.2vw,21px);margin-top:10px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-weight:600;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnav{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.qnav .spacer{flex:1}
.flag-on{color:var(--warn);border-color:var(--warn)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.side h3{font-size:15px;font-family:var(--body);font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.grid button{font-family:var(--mono);font-size:12px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;position:relative}
.grid button.ans{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid button.flg::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
.side .btn{width:100%;margin-top:14px}
.confirm{margin-top:18px;padding:18px;border-radius:var(--r);border:1.5px solid var(--accent);background:var(--accent-soft)}
.confirm.danger{border-color:var(--bad);background:var(--bad-soft)}
.confirm p{margin-bottom:12px}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
@media (max-width:560px){.score{grid-template-columns:1fr}}
.ring{width:140px;height:140px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums}
.verdict{display:inline-block;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:4px 12px;border-radius:999px}
.verdict.pass{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.verdict.fail{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:12px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.review li{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px}
.mark.ok{background:var(--good-soft);color:var(--good)}
.mark.no{background:var(--bad-soft);color:var(--bad)}
.review .q{font-weight:700;min-width:0}
.review .a{font-size:15px;margin-top:6px;color:var(--muted)}
.review .a b{color:var(--ink)}
.review .a .right{color:var(--good);font-weight:700}
.review .a .wrong{color:var(--bad);font-weight:700}

/* resources */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:19px}
.card p{color:var(--muted);font-size:15px}
.card a.more{margin-top:auto;font-family:var(--display);font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;padding:9px 14px;border-top:1px solid var(--line)}
th{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0;background:var(--surface-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);margin-top:10px}

footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:14px}
body.exam-mode footer{display:none}
.loading{color:var(--muted);padding:40px 0}

@media (max-width:560px){
  .unit-row{grid-template-columns:44px 1fr;padding:16px}
  .unit-row .weight{grid-column:2;text-align:left}
  .unit-num{font-size:24px}
  .subs a{grid-template-columns:48px 1fr;padding:10px 14px}
  .subs a .pill{grid-column:2;justify-self:start}
  .obj-head{grid-template-columns:auto 1fr;padding:12px 14px}
  .obj-head .pill{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion: reduce){.led.amber{animation:none}}
</style>

let INDEX = null;
const bankCache = {};
async function loadIndex(){
  if (INDEX) return INDEX;
  try { const r = await fetch("data/index.json", {cache:"no-cache"}); INDEX = r.ok ? await r.json() : {}; }
  catch(e){ INDEX = {}; }
  return INDEX;
}
async function loadBank(id){
  if (bankCache[id]) return bankCache[id];
  const r = await fetch("data/" + id + ".json");
  if (!r.ok) throw new Error("bank " + id);
  const rows = await r.json();
  bankCache[id] = rows.map(row => ({raw:row, src:id}));
  return bankCache[id];
}
function makeQuestion(item){
  const opts = item.raw.slice(1).map((t,i) => ({t, ok:i===0}));
  shuffle(opts);
  return {q:item.raw[0], opts:opts.map(o=>o.t), ans:opts.findIndex(o=>o.ok), src:item.src};
}
async function pickQuestions(ids, n){
  const idx = await loadIndex();
  const avail = ids.filter(id => idx[id]);
  const banks = await Promise.all(avail.map(loadBank));
  const seen = new Set(), pool = [];
  banks.flat().forEach(it => { if (!seen.has(it.raw[0])) { seen.add(it.raw[0]); pool.push(it); } });
  return shuffle(pool).slice(0, n).map(makeQuestion);
}

async function route(){
  stopQuiz();
  const h = (location.hash || "#home").slice(1);
  window.scrollTo(0,0);
  await loadIndex();
  if (h === "home" || h === "") return viewHome();
  if (h === "netplus") return viewNetplus();
  if (h === "other") return viewOther();
  if (h === "resources") return viewResources();
  const um = h.match(/^unit-([1-5])$/); if (um) return viewUnit(+um[1]);
  if (h.startsWith("su-") && NODE[fromHash(h)]) return viewSub(fromHash(h));
  viewHome();
}

      <div class="card"><h3>Cisco Packet Tracer</h3><p>Free network simulator. Build topologies, configure VLANs and routing, and test them.</p><a class="more" href="https://www.netacad.com/" target="_blank" rel="noopener">netacad.com →</a></div>
      <div class="card"><h3>Subnetting practice</h3><p>Unlimited subnetting drills with instant answers, good for objective 1.8.</p><a class="more" href="https://subnettingpractice.com/" target="_blank" rel="noopener">subnettingpractice.com →</a></div>
    </div>
    <h2 class="section-title">Common ports and protocols (objective 1.4)</h2>
    <div class="tablewrap"><table><thead><tr><th>Protocol</th><th>Port(s)</th><th>Transport</th></tr></thead>
      <tbody>${ports.map(p=>`<tr><td>${p[0]}</td><td class="num">${p[1]}</td><td class="num">${p[2]}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">* HTTPS is TCP 443; HTTP/3 also uses UDP 443 (QUIC). Learn the port numbers first; they are the most-tested detail.</p>
    <h2 class="section-title">OSI model at a glance (objective 1.1)</h2>
    <div class="tablewrap"><table><thead><tr><th>Layer</th><th>Name</th><th>PDU</th><th>Examples</th><th>Devices</th></tr></thead>
      <tbody>${osi.map(r=>`<tr><td class="num">${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Bottom up: <b>P</b>lease <b>D</b>o <b>N</b>ot <b>T</b>hrow <b>S</b>ausage <b>P</b>izza <b>A</b>way. * ARP works between Layers 2 and 3.</p>
    <h2 class="section-title">How testing works on this site</h2>
    <div class="cards">
      <div class="card"><h3>Practice set</h3><p>${SIZES.subunit} random questions from one sub-unit. Nothing is sent. Use it as often as you like.</p></div>
      <div class="card"><h3>Graded test</h3><p>${SIZES.subunit} random questions from one sub-unit. Your full results go to your instructor as a PDF.</p></div>
      <div class="card"><h3>Unit and full exams</h3><p>${SIZES.unit} questions in ${SIZES.unitMinutes} minutes per unit, or ${SIZES.full} questions in ${SIZES.fullMinutes} minutes for all of Network+. The exam submits itself when time runs out.</p></div>
    </div>
  </section>`;
}

/* ---------- name/email form ---------- */
function startExamForm(cfg){
  stopQuiz();
  setNav("netplus");
  const timed = cfg.minutes ? `${cfg.n} questions · ${cfg.minutes} minutes · pass ${PASS_MARK}%` : `${cfg.n} questions · pass ${PASS_MARK}%`;
  $app.innerHTML = `
  <section class="wrap page">
    <div class="pagehead"><span class="eyebrow">${cfg.kind === "graded" ? "Graded test" : "Practice exam"}</span><h1>${esc(cfg.title)}</h1><p>${timed}. ${cfg.minutes ? "The timer starts when you select Begin." : ""}</p></div>
    <form class="form" id="who" novalidate>
      <div class="field"><label for="fname">Full name</label><input id="fname" name="fname" autocomplete="name" required><span class="err" id="fname-err"></span></div>
      <div class="field"><label for="femail">Email address</label><input id="femail" name="femail" type="email" autocomplete="email" required><span class="err" id="femail-err"></span></div>
      <div class="row"><button class="btn btn-primary" type="submit">Begin</button><a class="btn btn-ghost" href="${cfg.back}">Cancel</a></div>
    </form>
  </section>`;
  document.getElementById("fname").focus();
  document.getElementById("who").addEventListener("submit", async e => {
    e.preventDefault();
    const name = document.getElementById("fname").value.trim();
    const email = document.getElementById("femail").value.trim();
    let ok = true;
    document.getElementById("fname-err").textContent = name.length >= 2 ? "" : (ok=false, "Enter your full name.");
    document.getElementById("femail-err").textContent = /^[^\s@]+@jobcorps\.org$/i.test(email) ? "" : (ok=false, "Not an employee email address.");
    if (!ok) return;
    const btn = e.submitter || e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Loading questions…";
    try {
      const qs = await pickQuestions(cfg.ids, cfg.n);
      beginQuiz({...cfg, qs, name, email});
    } catch(err) {
      btn.disabled = false; btn.textContent = "Begin";
      document.getElementById("femail-err").textContent = "Questions could not load. Check your connection and try again.";
    }
  });
}

/* ---------- quiz engine ---------- */
function stopQuiz(){
  if (quiz && quiz.timerId) clearInterval(quiz.timerId);
  document.body.classList.remove("exam-mode");
  window.onbeforeunload = null;
  quiz = null;
}
function beginQuiz(cfg){
  quiz = {...cfg, answers:new Array(cfg.qs.length).fill(null), flags:new Set(), cur:0, state:"running", confirm:null, startedAt:Date.now(), filter:"all"};
  if (cfg.kind !== "practice") { document.body.classList.add("exam-mode"); window.onbeforeunload = () => true; }
  if (cfg.minutes) {
    quiz.endsAt = Date.now() + cfg.minutes*60000;
    quiz.timerId = setInterval(tick, 1000);
  }
  window.scrollTo(0,0);
  renderQuiz();
}
function tick(){
  if (!quiz || quiz.state !== "running") return;
  const left = (quiz.endsAt - Date.now())/1000;
  const el = document.getElementById("timer");
  if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left <= 300); }
  if (left <= 0) { quiz.timedOut = true; finishQuiz(); }
}
function renderQuiz(){
  const z = quiz, q = z.qs[z.cur], total = z.qs.length;
  const answered = z.answers.filter(a=>a!==null).length;
  const isExam = z.kind !== "practice";
  $app.innerHTML = `
  <section class="wrap page" style="padding-top:8px">
    <div class="qbar"><span class="title">${esc(z.title)}</span><span class="count">${answered}/${total} answered</span>
      ${z.minutes ? `<span class="timer" id="timer" role="timer" aria-label="Time remaining">${fmtTime((z.endsAt-Date.now())/1000)}</span>` : ""}</div>
    <div class="quiz-layout">
      <div>
        <div class="qcard">
          <div class="qnum"><span>Question ${z.cur+1} of ${total}</span>${z.flags.has(z.cur) ? `<span class="pill" style="color:var(--warn);border-color:var(--warn)">Flagged</span>`:""}</div>
          <p class="qtext" id="qtext">${esc(q.q)}</p>
          <div class="opts" role="radiogroup" aria-labelledby="qtext">
            ${q.opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="${z.answers[z.cur]===i}" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join("")}
          </div>
          <div class="qnav">
            <button class="btn btn-ghost btn-sm" id="prev" ${z.cur===0?"disabled":""}>← Previous</button>
            <button class="btn btn-ghost btn-sm ${z.flags.has(z.cur)?"flag-on":""}" id="flag">${z.flags.has(z.cur)?"Unflag":"Flag for review"}</button>
            <span class="spacer"></span>
            ${z.cur < total-1 ? `<button class="btn btn-primary btn-sm" id="next">Next →</button>` : `<button class="btn btn-primary btn-sm" id="submit2">${isExam ? "Submit and grade" : "Finish and grade"}</button>`}
          </div>
        </div>
        ${z.confirm === "submit" ? `<div class="confirm" role="alertdialog" aria-labelledby="cft"><p id="cft"><b>Submit and grade now?</b> ${total-answered ? `You have ${total-answered} unanswered question${total-answered>1?"s":""}. Unanswered questions are marked incorrect.` : "All questions are answered."}</p>
          <div class="row"><button class="btn btn-primary" id="doSubmit">Submit and grade</button><button class="btn btn-ghost" id="keep">Keep working</button></div></div>` : ""}
        ${z.confirm === "cancel" ? `<div class="confirm danger" role="alertdialog" aria-labelledby="cfc"><p id="cfc"><b>${isExam ? "Cancel this exam?" : "Quit this practice set?"}</b> Your answers will not be graded${isExam ? " or sent" : ""}.</p>
          <div class="row"><button class="btn btn-danger" id="doCancel">${isExam ? "Cancel exam" : "Quit"}</button><button class="btn btn-ghost" id="keep">Keep working</button></div></div>` : ""}
      </div>
      <aside class="side" aria-label="Question navigator">
        <h3>Questions</h3>
        <div class="grid">${z.qs.map((_,i)=>`<button data-go="${i}" class="${z.answers[i]!==null?"ans":""} ${i===z.cur?"cur":""} ${z.flags.has(i)?"flg":""}" aria-label="Question ${i+1}${z.answers[i]!==null?", answered":""}${z.flags.has(i)?", flagged":""}">${i+1}</button>`).join("")}</div>
        <div class="legend"><span>■ answered</span><span style="color:var(--warn)">● flagged</span></div>
        <button class="btn btn-primary btn-sm" id="submit">${isExam ? "Submit and grade" : "Finish and grade"}</button>
        <button class="btn btn-ghost btn-sm" id="cancel">${isExam ? "Cancel exam" : "Quit practice"}</button>
      </aside>
    </div>
  </section>`;
  $app.querySelectorAll(".opt").forEach(b => b.onclick = () => { z.answers[z.cur] = +b.dataset.i; renderQuiz(); });
  $app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { z.cur = +b.dataset.go; z.confirm=null; renderQuiz(); });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("prev", () => { z.cur--; z.confirm=null; renderQuiz(); });
  on("next", () => { z.cur++; z.confirm=null; renderQuiz(); });
  on("flag", () => { z.flags.has(z.cur) ? z.flags.delete(z.cur) : z.flags.add(z.cur); renderQuiz(); });
  on("submit", () => { z.confirm="submit"; renderQuiz(); document.getElementById("doSubmit")?.focus(); });
  on("submit2", () => { z.confirm="submit"; renderQuiz(); document.getElementById("doSubmit")?.focus(); });
  on("cancel", () => { z.confirm="cancel"; renderQuiz(); document.getElementById("doCancel")?.focus(); });
  on("keep", () => { z.confirm=null; renderQuiz(); });
  on("doSubmit", finishQuiz);
  on("doCancel", () => { const back = z.back; stopQuiz(); if (location.hash === back) route(); else location.hash = back; });
}
document.addEventListener("keydown", e => {
  if (!quiz || quiz.state !== "running" || e.target.matches("input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase(), i = LETTERS.indexOf(k);
  if (i >= 0 && i < quiz.qs[quiz.cur].opts.length) { quiz.answers[quiz.cur] = i; renderQuiz(); }
  else if (e.key === "ArrowRight" && quiz.cur < quiz.qs.length-1) { quiz.cur++; quiz.confirm=null; renderQuiz(); }
  else if (e.key === "ArrowLeft" && quiz.cur > 0) { quiz.cur--; quiz.confirm=null; renderQuiz(); }
});

function finishQuiz(){
  const z = quiz; if (!z || z.state !== "running") return;
  if (z.timerId) clearInterval(z.timerId);
  window.onbeforeunload = null;
  z.state = "results";
  z.finishedAt = Date.now();
  z.items = z.qs.map((q,i) => ({n:i+1, q:q.q, chosen: z.answers[i]===null ? "" : q.opts[z.answers[i]], correct:q.opts[q.ans], ok: z.answers[i]===q.ans, src:q.src}));
  z.correct = z.items.filter(x=>x.ok).length;
  z.total = z.items.length;
  z.percent = Math.round(z.correct / z.total * 1000) / 10;
  z.passed = z.correct / z.total >= PASS_MARK/100;
  z.sendStatus = z.kind === "practice" ? null : "sending";
  renderResults();
  if (z.kind !== "practice") sendResults(z).then(s => { if (quiz === z) { z.sendStatus = s; renderSendStatus(); } });
}
async function sendResults(z){
  if (!CONFIG.endpoint) return "notset";
  const payload = {
    type: z.kind, title: z.title, name: z.name, email: z.email,
    correct: z.correct, total: z.total, percent: z.percent, passed: z.passed, passMark: PASS_MARK,
    timedOut: !!z.timedOut, started: new Date(z.startedAt).toISOString(), finished: new Date(z.finishedAt).toISOString(),
    durationSec: Math.round((z.finishedAt - z.startedAt)/1000),
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
  };
  if (z.kind === "graded") payload.items = z.items.map(({n,q,chosen,correct,ok}) => ({n,q,chosen,correct,ok}));
  try {
    await fetch(CONFIG.endpoint, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
    return "sent";
  } catch(e) { return "failed"; }
}
function renderSendStatus(){
  const el = document.getElementById("sendStatus"); if (!el || !quiz) return;
  const map = {
    sending: ["", "Sending your results to your instructor…"],
    sent: ["ok", "Your results were sent to your instructor."],
    notset: ["err", "Your results could not be sent because the site's email connection is not set up yet. Show this screen to your instructor."],
    failed: ["err", "Your results could not be sent. Check your internet connection and tell your instructor before leaving this page."]
  };
  const [cls, msg] = map[quiz.sendStatus];
  el.className = "notice " + cls; el.textContent = msg;
}
function renderResults(){
  const z = quiz, C = 2*Math.PI*58, dash = C * z.correct / z.total;
  const showItems = z.items.filter(x => z.filter==="all" || (z.filter==="wrong" ? !x.ok : x.ok));
  const wrongCount = z.total - z.correct;
  $app.innerHTML = `
  <section class="wrap page">
    <div class="pagehead"><span class="eyebrow">Results</span><h1>${esc(z.title)}</h1>${z.name ? `<p>${esc(z.name)} · ${esc(z.email)}</p>`:""}</div>
    ${z.timedOut ? `<div class="notice" style="margin-bottom:16px">Time is up. Your exam was submitted automatically.</div>` : ""}
    <div class="score">
      <div class="ring"><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="58" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="70" cy="70" r="58" fill="none" stroke="${z.passed?"var(--good)":"var(--bad)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${dash} ${C}"/></svg><span class="pct">${z.percent}%</span></div>
      <div><span class="verdict ${z.passed?"pass":"fail"}">${z.passed ? "Passed" : "Not passed"}</span>
        <div class="stats"><span>Correct <b>${z.correct}</b></span><span>Incorrect <b>${wrongCount}</b></span><span>Total <b>${z.total}</b></span><span>Pass mark <b>${PASS_MARK}%</b></span><span>Time <b>${fmtTime((z.finishedAt-z.startedAt)/1000)}</b></span></div>
        ${z.sendStatus ? `<div id="sendStatus" class="notice" style="margin-top:14px" role="status"></div>` : ""}
        <div class="row" style="margin-top:16px"><a class="btn btn-primary" href="${z.back}" id="backBtn">Back</a>${z.kind==="practice" ? `<button class="btn btn-ghost" id="again">New practice set</button>`:""}</div>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Filter review">
      <button class="btn btn-ghost btn-sm" data-f="all" aria-pressed="${z.filter==="all"}">All (${z.total})</button>
      <button class="btn btn-ghost btn-sm" data-f="wrong" aria-pressed="${z.filter==="wrong"}">Incorrect (${wrongCount})</button>
      <button class="btn btn-ghost btn-sm" data-f="right" aria-pressed="${z.filter==="right"}">Correct (${z.correct})</button>
    </div>
    <ol class="review">
      ${showItems.map(x => `<li><span class="mark ${x.ok?"ok":"no"}" aria-label="${x.ok?"Correct":"Incorrect"}">${x.ok?"✓":"✗"}</span>
        <div><p class="q">${x.n}. ${esc(x.q)}</p>
          <p class="a">Your answer: ${x.chosen ? `<span class="${x.ok?"right":"wrong"}">${esc(x.chosen)}</span>` : `<span class="wrong">No answer</span>`}</p>
          ${x.ok ? "" : `<p class="a">Correct answer: <span class="right">${esc(x.correct)}</span></p>`}</div></li>`).join("") || `<li><span></span><p>Nothing to show.</p></li>`}
    </ol>
  </section>`;
  renderSendStatus();
  document.body.classList.remove("exam-mode");
  $app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { z.filter = b.dataset.f; renderResults(); });
  document.getElementById("backBtn").onclick = e => { e.preventDefault(); const back = z.back; stopQuiz(); if (location.hash === back) route(); else location.hash = back; };
  const again = document.getElementById("again");
  if (again) again.onclick = () => { const id = fromHash(z.back.slice(1)); stopQuiz(); pickQuestions([id], SIZES.subunit).then(qs => beginQuiz({kind:"practice", title:z.title, qs, back:z.back})); };
  window.scrollTo(0,0);
}

/* ---------- splash network animation ---------- */
let netRAF = null;
function startNetCanvas(){
  cancelAnimationFrame(netRAF);
  const cv = document.getElementById("net"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const lineCol = css.getPropertyValue("--hero-line").trim() || "#3cc4d8";
  const ledCol = css.getPropertyValue("--led").trim() || "#36d47c";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, nodes = [], packets = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size(){
    const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.min(70, Math.max(24, Math.round(W*H/16000)));
    nodes = Array.from({length:count}, () => ({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, r:Math.random()<.18?3.2:1.8}));
  }
  size();
  const LINK = 150;
  function frame(){
    if (!document.getElementById("net")) return;
    ctx.clearRect(0,0,W,H);
    for (const n of nodes){ if(!reduce){ n.x+=n.vx; n.y+=n.vy; if(n.x<0||n.x>W) n.vx*=-1; if(n.y<0||n.y>H) n.vy*=-1; } }
    ctx.lineWidth = 1;
    const edges = [];
    for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if (d<LINK){ edges.push([a,b]); ctx.globalAlpha = (1-d/LINK)*.35; ctx.strokeStyle = lineCol; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    ctx.globalAlpha = .9;
    for (const n of nodes){ ctx.fillStyle = n.r>3 ? lineCol : "#7f93ad"; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill(); }
    if (!reduce){
      if (packets.length < 14 && edges.length && Math.random() < .12){ const e = edges[Math.floor(Math.random()*edges.length)]; packets.push({a:e[0], b:e[1], t:0, s:.008+Math.random()*.012}); }
      packets = packets.filter(p => (p.t += p.s) < 1);
      ctx.fillStyle = ledCol; ctx.globalAlpha = 1;
      for (const p of packets){ const x=p.a.x+(p.b.x-p.a.x)*p.t, y=p.a.y+(p.b.y-p.a.y)*p.t; ctx.beginPath(); ctx.arc(x,y,2.4,0,Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    if (!reduce) netRAF = requestAnimationFrame(frame);
  }
  frame();
  window.onresize = () => { if (document.getElementById("net")) { size(); if (reduce) frame(); } };
}

route();
</script>
